{% extends "_login_moldura.html" %}
{% block cartao %}
{% set erros = erros or {} %}
<form method="post" action="{{ url_for('entrar') }}" class="lg-form" novalidate data-lg-form {{ 'data-previa' if previa }}>
  <div class="lg-campo{{ ' lg-campo--erro' if erros.login }}">
    <label class="lg-rotulo" for="lg-login">Usuário ou e-mail</label>
    <div class="lg-entrada">
      <svg class="lg-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8zm0 2a2 2 0 1 1 0 4 2 2 0 0 1 0-4zm0 7c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4zm0 2c2.9 0 6 1.5 6 2v0H6c0-.5 3.1-2 6-2z"/></svg>
      <input id="lg-login" name="login" type="text" value="{{ login_digitado or '' }}"
             autocomplete="username" autocapitalize="none" spellcheck="false" inputmode="email"
             placeholder="Digite seu usuário ou e-mail" required data-obrigatorio="Informe seu usuário ou e-mail."
             aria-describedby="lg-login-erro{{ ' lg-erro-geral' if erro_geral }}" aria-invalid="{{ 'true' if erros.login else 'false' }}"
             {{ 'autofocus' if not login_digitado and not previa }}>
    </div>
    <p class="lg-erro" id="lg-login-erro" aria-live="polite">{{ erros.login or '' }}</p>
  </div>
  <div class="lg-campo{{ ' lg-campo--erro' if erros.senha }}">
    <label class="lg-rotulo" for="lg-senha">Senha</label>
    <div class="lg-entrada">
      <svg class="lg-icone" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M18 8h-1V6A5 5 0 0 0 7 6v2H6a2 2 0 0 0-2 2v10c0 1.1.9 2 2 2h12a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2zM9 6a3 3 0 1 1 6 0v2H9V6zm9 14H6V10h12v10zm-6-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
      <input id="lg-senha" name="senha" type="password" autocomplete="current-password"
             placeholder="Digite sua senha" required data-obrigatorio="Informe sua senha."
             aria-describedby="lg-senha-erro" aria-invalid="{{ 'true' if erros.senha else 'false' }}"
             {{ 'autofocus' if login_digitado and not previa }}>
      <button type="button" class="lg-olho" data-olho aria-controls="lg-senha" aria-pressed="false" aria-label="Mostrar senha">
        <svg class="lg-olho-fechado" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 5C7 5 2.7 8.1 1 12.5 2.7 16.9 7 20 12 20s9.3-3.1 11-7.5C21.3 8.1 17 5 12 5zm0 12.5a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>
        <svg class="lg-olho-aberto" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M2 4.3 3.3 3 21 20.7 19.7 22l-3.2-3.2A11.6 11.6 0 0 1 12 20c-5 0-9.3-3.1-11-7.5a12 12 0 0 1 4-5.1L2 4.3zm5.5 5.5A5 5 0 0 0 14.2 16.5l-1.6-1.6a3 3 0 0 1-3.5-3.5L7.5 9.8zM12 5c5 0 9.3 3.1 11 7.5-.6 1.6-1.6 3-2.8 4.2l-3.3-3.3A5 5 0 0 0 11.1 7.1L8.8 4.9A12 12 0 0 1 12 5z"/></svg>
      </button>
    </div>
    <p class="lg-erro" id="lg-senha-erro" aria-live="polite">{{ erros.senha or '' }}</p>
  </div>
  <div class="lg-opcoes">
    <label class="lg-lembrar"><input type="checkbox" name="lembrar" value="1" {{ 'checked' if lembrar }}> Lembrar de mim</label>
    <a class="lg-link" href="{{ url_for('esqueci_senha') }}">Esqueceu a senha?</a>
  </div>
  <button type="submit" class="lg-botao" data-carregando="Entrando…">
    <span class="lg-botao-texto">Entrar</span>
    <svg class="lg-botao-seta" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12 4l-1.4 1.4 5.6 5.6H4v2h12.2l-5.6 5.6L12 20l8-8z"/></svg>
    <span class="lg-giro" aria-hidden="true"></span>
  </button>
</form>
{% endblock %}
